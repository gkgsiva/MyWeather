name: Weather Union readings

# Reads Weather Union's nearest-station weather (temperature, humidity, wind,
# rain) for 12 areas of Chennai and 12 other Tamil Nadu cities with scripts/weather_union.py and publishes
# weatherunion/latest.json and history.json on the `data` branch, for the
# app's "Neighbourhood weather" screen.
#
# The API key is the repository secret WEATHER_UNION_KEY (Settings → Secrets
# and variables → Actions). It is used only here and never reaches the app or
# the repository. 12 calls every 30 minutes plus 12 more once an hour is about 860 a day, under Weather
# Union's 1000 a day. Shares the `data` branch with the other data workflows.

on:
  schedule:
    - cron: "10,40 * * * *"
  workflow_dispatch:
  pull_request:
    paths: ["scripts/weather_union.py", ".github/workflows/weather-union.yml"]

permissions:
  contents: write

concurrency:
  group: data-branch
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the data branch
        run: |
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch --depth 1 origin data
            git worktree add data FETCH_HEAD
          else
            mkdir -p data
          fi
          mkdir -p data/weatherunion

      # TEMPORARY: every v01 endpoint answered 404. Try other versions and
      # read the locality list (ids, names, positions) the site's own page holds.
      - name: Probe the API
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          K: ${{ secrets.WEATHER_UNION_KEY }}
        run: |
          curl -sL -m 30 -o /tmp/p.html https://www.weatherunion.com/
          echo "=== around ZWL001036"
          grep -aoE ".{700}ZWL001036.{900}" /tmp/p.html | head -c 2200
          echo; echo "=== Chennai mentions"
          grep -aoE ".{200}Chennai.{300}" /tmp/p.html | head -c 1500
          echo; echo "=== api/endpoint words"
          grep -aoE "(external/v[0-9]+[a-z_/]*|get_[a-z_]+|x-zomato[a-z-]*|api\.weatherunion[^\"\\ ]*)" /tmp/p.html | sort -u | head
          B=https://www.weatherunion.com/gw/weather/external
          for u in \
            "$B/v0/get_weather_data?latitude=13.0418&longitude=80.2341" \
            "$B/v0/get_locality_weather_data?locality_id=ZWL001156" \
            "$B/v1/get_weather_data?latitude=13.0418&longitude=80.2341" \
            "$B/v1/get_locality_weather_data?locality_id=ZWL001156" \
            "$B/v2/get_locality_weather_data?locality_id=ZWL001156" \
            "$B/v0/get_equipment_weather_data?equipment_id=ZWE000001"; do
            echo "=== $u"
            curl -s -m 30 -w "\nHTTP %{http_code}\n" -H "X-Zomato-API-Key: $K" "$u" | head -c 500
          done

      - name: Read Weather Union
        id: read
        env:
          WEATHER_UNION_KEY: ${{ secrets.WEATHER_UNION_KEY }}
        run: |
          flags=""
          if [ "${{ github.event_name }}" = pull_request ] || [ "${{ github.event_name }}" = workflow_dispatch ]; then flags="--verbose --all"; fi
          changed=$(python3 scripts/weather_union.py data/weatherunion $flags)
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
          if [ "${{ github.event_name }}" = pull_request ]; then
            echo "----- latest.json -----"; cat data/weatherunion/latest.json; echo
          fi

      # On a pull request the reader is only tried, never published.
      - name: Publish to the data branch
        if: steps.read.outputs.changed != '' && github.event_name != 'pull_request'
        working-directory: data
        run: |
          rm -rf .git-new && mkdir .git-new
          for d in daily-report cyclone weatherunion; do
            if [ -d "$d" ]; then cp -r "$d" .git-new/; fi
          done
          cat > .git-new/README.md <<'MD'
          Data for the MyWeather app, written by the "IMD daily report", "IMD cyclone bulletin" and "Weather Union readings" workflows on main.
          This branch is rewritten on every run; don't commit to it by hand.
          MD
          cd .git-new
          git init -q -b data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Weather Union readings"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data
