name: Android APK

# Builds the Android app (android/) and attaches MyWeather-<version>.apk to a
# GitHub release.
#
# - Publishing a release builds the APK from the release tag and attaches it.
# - "Run workflow" (Actions tab) builds from the chosen branch and attaches the
#   APK to an existing release, e.g. a release published before this workflow.
#   Leave the tag empty to only build (the APK is kept as a workflow artifact).
# - Pushing a version tag (e.g. git push origin v1.1) creates that release with
#   generated notes if it doesn't exist yet, then attaches the APK.
# - Pull requests and pushes to main build the APK and keep it as a workflow
#   artifact, so a broken Android build shows up before release.
#
# Signing secrets (see README "Signing with your own key"). Without them the
# APK is signed with a throwaway debug key, which installs fine but cannot be
# updated in place by a later build signed with a different key. If the
# keystore secret is set, the other three must be too, or the build fails.
#   ANDROID_KEYSTORE_BASE64   base64 of the .jks/.keystore file
#   ANDROID_KEYSTORE_PASSWORD
#   ANDROID_KEY_ALIAS
#   ANDROID_KEY_PASSWORD
#
# Optional: WEATHER_API_KEY, the Wunderground (api.weather.com) key for the
# station dashboard, built into js/config.js of the APK.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to attach the APK to (e.g. v1.0); leave empty to only build"
        required: false
  pull_request:
    paths: ["android/**", "index.html", "css/**", "js/**", ".github/workflows/android-apk.yml"]
  push:
    branches: [main]
    tags: ["v*"]
    paths: ["android/**", "index.html", "css/**", "js/**", ".github/workflows/android-apk.yml"]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ubuntu-latest ships the Android SDK (ANDROID_HOME); the Android Gradle
      # plugin downloads any missing platform or build-tools itself.
      - uses: gradle/actions/setup-gradle@v4

      - name: Work out version
        id: version
        run: |
          if [ -n "$TAG" ]; then
            name="${TAG#v}"
          else
            name="0.0.${GITHUB_RUN_NUMBER}-dev"
          fi
          echo "name=$name" >> "$GITHUB_OUTPUT"

      # Shows the version on the app's Info screen.
      - name: Write app version
        run: printf 'export const APP_VERSION = "%s";\n' "${{ steps.version.outputs.name }}" > js/version.js

      - name: Set up signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::warning::No ANDROID_KEYSTORE_BASE64 secret; signing with a debug key. This APK will not install over one signed with your own key."
            exit 0
          fi
          missing=""
          for v in ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            [ -n "${!v}" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::ANDROID_KEYSTORE_BASE64 is set but these secrets are missing:$missing"
            exit 1
          fi
          # Tolerate line breaks or spaces pasted into the secret.
          echo "$KEYSTORE_BASE64" | tr -d ' \r\n' | base64 -d > "$RUNNER_TEMP/release.keystore"
          if ! keytool -list -keystore "$RUNNER_TEMP/release.keystore" \
                -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$ANDROID_KEY_ALIAS" >/dev/null; then
            echo "::error::Could not open the keystore with ANDROID_KEYSTORE_PASSWORD, or it has no key named ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          echo "Signing with the release key from secrets."

      # Builds the Wunderground API key into the app (js/config.js) when the
      # WEATHER_API_KEY repository secret is set. The key is never committed.
      - name: Add Wunderground API key
        env:
          WEATHER_API_KEY: ${{ secrets.WEATHER_API_KEY }}
        run: |
          if [ -z "$WEATHER_API_KEY" ]; then
            echo "::notice::No WEATHER_API_KEY secret; the app will ask for a key on the Wunderground screen."
            exit 0
          fi
          printf 'export const WEATHER_API_KEY = "%s";\n' "$WEATHER_API_KEY" > js/config.js

      - name: Build APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PversionName="${{ steps.version.outputs.name }}" \
            -PversionCode="${GITHUB_RUN_NUMBER}"
          mkdir -p "$RUNNER_TEMP/out"
          cp app/build/outputs/apk/release/app-release.apk \
            "$RUNNER_TEMP/out/MyWeather-${{ steps.version.outputs.name }}.apk"

      - name: Show signing certificate
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          "$apksigner" verify --print-certs "$RUNNER_TEMP"/out/*.apk | tee "$RUNNER_TEMP/certs.txt"
          {
            echo "### APK signing certificate"
            echo '```'
            grep -E "certificate (DN|SHA-256)" "$RUNNER_TEMP/certs.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: MyWeather-${{ steps.version.outputs.name }}-apk
          path: ${{ runner.temp }}/out/*.apk

      - name: Create release for a pushed tag
        if: github.event_name == 'push' && github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 ||
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "MyWeather $TAG" --generate-notes

      - name: Attach APK to release
        if: env.TAG != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP"/out/*.apk --clobber --repo "$GITHUB_REPOSITORY"
